name: Deploy
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: write # only used once, to commit the unpacked source
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
 
      # First run only: unpack an uploaded source zip into the repo and commit it.
      - name: Unpack uploaded source zip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip to unpack."; exit 0; fi
          zip="${zips[0]}"
          tmp="$(mktemp -d)"
          unzip -q "$zip" -d "$tmp"
          rm -rf "$tmp/__MACOSX"
          src="$tmp"
          if [ ! -f "$src/package.json" ]; then
            inner=("$tmp"/*/)
            if [ ${#inner[@]} -eq 1 ] && [ -f "${inner[0]}package.json" ]; then src="${inner[0]}"; fi
          fi
          if [ ! -f "$src/package.json" ]; then echo "::error::No package.json found inside $zip"; exit 1; fi
          rm -rf "$src/node_modules" "$src/dist" "$src/.github"
          find "$src" -name .DS_Store -delete
          cp -a "$src"/. .
          git rm -q "$zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $zip"
          git push
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
 
      - run: npm ci
      - run: npm test
 
      - id: pages
        uses: actions/configure-pages@v5
 
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
 
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
 
      - id: deployment
        uses: actions/deploy-pages@v4
